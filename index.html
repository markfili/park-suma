<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zagreb Park-Šuma Bingo</title>

<!-- Leaflet (map). Loaded from CDN with Subresource Integrity. -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">

<script>
  // Cache-busting: fresh token per load so edits always show on refresh.
  window.__V = Date.now();
  document.write('<link rel="stylesheet" href="styles.css?v=' + window.__V + '">');
</script>
</head>
<body>
  <header>
    <div class="topbar">
      <button class="iconbtn" id="shareBtn" data-i18n-title="title.share" data-i18n-aria="title.share">📤</button>
      <h1>🌲 Park-Šuma <span class="b">Bingo</span></h1>
      <button class="iconbtn" id="infoBtn" data-i18n-title="title.help" data-i18n-aria="title.help">ℹ️</button>
    </div>

    <div class="progress">
      <div class="lvl">
        <span class="lvl-badge" id="lvlBadge">🌱</span>
        <div class="lvl-text">
          <strong id="lvlName">Klica</strong>
          <span class="muted" id="lvlNext"></span>
        </div>
        <span class="lvl-count" id="count">0 / 24</span>
      </div>
      <div class="track"><div class="track-fill" id="trackFill"></div></div>
      <div class="mode-toggle" id="modeToggle">
        <button class="modeseg active" data-mode="count" data-i18n="mode.count">Po broju</button>
        <button class="modeseg" data-mode="area" data-i18n="mode.size">Po veličini</button>
      </div>
      <div class="hint muted" id="haStat"></div>
      <div class="hint muted" id="nearHint"></div>
      <div class="hint goal-chip" id="goalChip" style="display:none"></div>
    </div>

    <div class="toggle" id="toggle">
      <button class="seg active" data-view="card" data-i18n="toggle.card">🎲 Kartica</button>
      <button class="seg" data-view="map" data-i18n="toggle.map">🗺 Karta</button>
    </div>
  </header>

  <main>
    <section id="cardView" class="view active">
      <div class="board" id="board"></div>
      <div class="controls">
        <button id="new" data-i18n="btn.newCard">🔀 Nova kartica</button>
        <button id="whereNext" class="ghost" data-i18n="btn.whereNext">🎟 Kamo dalje?</button>
        <button id="locate" class="ghost" data-i18n="btn.locate">📍 Lociraj me</button>
        <button id="reset" class="ghost danger" data-i18n="btn.reset">♻️ Poništi</button>
      </div>
    </section>

    <section id="mapView" class="view">
      <div id="map"></div>
      <div class="legend muted" data-i18n="legend">🟢 posjećeno · ⚪ još ne · 🟡 cilj · 🔵 ti · dodirni oznaku za prijavu</div>
      <button id="bikesToggle" class="ghost" data-i18n="bikes.show">🚲 Prikaži bicikle</button>
      <div class="bikes-err" id="bikesErr" role="status" aria-live="polite"></div>
      <div class="bikes-hint muted" id="bikesHint"></div>
    </section>
  </main>

  <section class="districts" id="districts"></section>

  <footer>
    <span data-i18n="footer.tagline">24 zaštićene park-šume grada Zagreba</span> · 🟢 greengo demo ·
    <span id="gpsStatus"></span><br>
    <span class="ver"><span id="appVer">v0.12.0</span> <span id="sha"></span></span>
    <span class="lang" id="langToggle"><button data-lang="hr">HR</button><button data-lang="en">EN</button></span>
  </footer>

  <!-- celebration banner -->
  <div class="banner" id="banner">
    <div class="banner-card">
      <div class="banner-emoji" id="bEmoji">🎉</div>
      <h2 id="bTitle">BINGO!</h2>
      <p id="bMsg"></p>
      <button id="bClose" data-i18n="banner.close">Super!</button>
    </div>
  </div>

  <!-- scratch card -->
  <div class="scratch" id="scratch">
    <div class="scratch-card">
      <button class="modal-x" id="scClose" aria-label="✕">✕</button>
      <h3 data-i18n="scratch.title">🎟 Kamo dalje?</h3>
      <div class="scratch-area" id="scArea">
        <div class="reveal" id="scReveal"></div>
        <canvas class="foil" id="scFoil"></canvas>
      </div>
      <div class="scratch-hint muted" id="scHint" data-i18n="scratch.hintStart">Grebi foliju da otkriješ sljedeći park…</div>
      <div class="scratch-actions">
        <button id="scReroll" class="ghost" data-i18n="scratch.reroll">🔄 Ponovi</button>
        <button id="scRevealBtn" class="ghost" data-i18n="scratch.reveal">Otkrij</button>
        <a id="scNav" class="pop-btn" href="#" target="_blank" rel="noopener" style="display:none" data-i18n="scratch.nav">Navigacija ↗</a>
        <button id="scShare" class="ghost" style="display:none" data-i18n="scratch.share">📤 Podijeli</button>
        <button id="scAccept" disabled data-i18n="scratch.accept">🎯 Prihvati</button>
      </div>
    </div>
  </div>

  <!-- help / what's new -->
  <div class="help" id="help">
    <div class="help-card">
      <button class="modal-x" id="helpX" aria-label="✕">✕</button>
      <div class="help-tabs" id="helpTabs">
        <button class="help-tab active" data-tab="howto" data-i18n="help.howto">Kako igrati</button>
        <button class="help-tab" data-tab="news" data-i18n="help.news">Novosti</button>
      </div>
      <div class="help-body" id="helpBody"></div>
    </div>
  </div>

  <!-- share: compose your own -->
  <div class="share" id="share">
    <div class="share-card">
      <button class="modal-x" id="shareX" aria-label="✕">✕</button>
      <h3 data-i18n="share.title">📤 Podijeli statistiku</h3>
      <label class="share-name">👤 <input id="shareName" data-i18n-ph="share.namePh" placeholder="tvoje ime" maxlength="24" autocomplete="off"></label>
      <div class="share-stats" id="shareStats"></div>
      <canvas id="shareCanvas" width="1200" height="630"></canvas>
      <div class="share-actions">
        <button id="shareCopy" class="ghost" data-i18n="share.copy">🔗 Kopiraj link</button>
        <button id="shareNative" class="ghost" data-i18n="share.share">📤 Podijeli</button>
        <button id="shareImg" data-i18n="share.saveImg">🖼 Spremi sliku</button>
      </div>
    </div>
  </div>

  <!-- share: a stats link someone opened -->
  <div class="share" id="shareView">
    <div class="share-card">
      <h3 id="svTitle">👤</h3>
      <div class="share-stats" id="svStats"></div>
      <div class="sv-dots" id="svDots"></div>
      <div class="share-actions">
        <button id="svPlay" data-i18n="share.playOwn">🌲 Igraj svoju</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Leaflet, then data, then i18n, then app + modules — after the DOM exists. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    (function () {
      function load(src, cb) {
        var s = document.createElement('script');
        s.src = src + '?v=' + window.__V;
        s.onload = cb || null;
        document.body.appendChild(s);
      }
      load('parks.js', function () {
        load('i18n.js', function () {
          load('app.js', function () {
            load('scratch.js', function () { load('share.js', function () { load('bikes.js'); }); });
          });
        });
      });
    })();
  </script>
</body>
</html>
