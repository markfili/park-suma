<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zagreb Park-Šuma Bingo</title>

<!-- Leaflet (map). Loaded from CDN with Subresource Integrity. -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">

<script>
  // Cache-busting: fresh token per load so edits always show on refresh.
  window.__V = Date.now();
  document.write('<link rel="stylesheet" href="styles.css?v=' + window.__V + '">');
</script>
</head>
<body>
  <header>
    <h1>🌲 Zagreb Park-Šuma <span class="b">BINGO</span></h1>

    <div class="progress">
      <div class="lvl">
        <span class="lvl-badge" id="lvlBadge">🌱</span>
        <div class="lvl-text">
          <strong id="lvlName">Seedling</strong>
          <span class="muted" id="lvlNext">Next: 5 → Sprout</span>
        </div>
        <span class="lvl-count" id="count">0 / 24</span>
      </div>
      <div class="track"><div class="track-fill" id="trackFill"></div></div>
      <div class="hint muted" id="nearHint"></div>
    </div>

    <div class="toggle" id="toggle">
      <button class="seg active" data-view="card">🎲 Card</button>
      <button class="seg" data-view="map">🗺 Map</button>
    </div>
  </header>

  <main>
    <section id="cardView" class="view active">
      <div class="board" id="board"></div>
      <div class="controls">
        <button id="new">🔀 Nova kartica</button>
        <button id="locate" class="ghost">📍 Locate me</button>
      </div>
    </section>

    <section id="mapView" class="view">
      <div id="map"></div>
      <div class="legend muted">🟢 visited · ⚪ not yet · 🔵 you · tap a pin to check in</div>
    </section>
  </main>

  <section class="districts" id="districts"></section>

  <footer>
    24 zaštićenih park-šuma grada Zagreba · 🟢 greengo demo ·
    <span id="gpsStatus">GPS off — honor mode</span><br>
    <span class="ver">v0.4.0 · 2026-05-25</span>
  </footer>

  <div class="banner" id="banner">
    <div class="banner-card">
      <div class="banner-emoji" id="bEmoji">🎉</div>
      <h2 id="bTitle">BINGO!</h2>
      <p id="bMsg"></p>
      <button id="bClose">Nice!</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Leaflet library, then data, then app — all after the DOM exists. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    (function () {
      function load(src, cb) {
        var s = document.createElement('script');
        s.src = src + '?v=' + window.__V;
        s.onload = cb || null;
        document.body.appendChild(s);
      }
      load('parks.js', function () { load('app.js'); });
    })();
  </script>
</body>
</html>
